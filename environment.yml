name: yolo
channels:
  - defaults
  - conda-forge

dependencies:
  - python=3.8
  - numpy
  - scipy
  - pandas
  - matplotlib
  - pillow
  - scikit-learn
  - tqdm
  - joblib
  - pip
  - pip:
      - fitter
      - filterpy      # Kalman filter (required by ByteTracker)
      - lap           # fast linear assignment (optional speedup)
